name: public nexus probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -u
          echo "egress=$(curl -sS --max-time 10 https://api.ipify.org || true)"
          echo "region=${RUNNER_TRACKING_ID:-unknown}"
          uname -a

      - name: Public DNS view
        shell: bash
        run: |
          set -u
          for host in \
            npm.artifacts.furycloud.io \
            production.furycloud.io \
            write-us-east-1-npm.artifacts.furycloud.io \
            read-us-east-1-npm.artifacts.furycloud.io \
            npm.nexus-pro.artifacts.furycloud.io
          do
            echo "===== ${host} ====="
            dig +short "${host}" A || true
            dig +short "${host}" CNAME || true
          done

      - name: Probe direct public names
        shell: bash
        run: |
          set -u
          probe() {
            local url="$1"
            echo "===== ${url} ====="
            curl -k -sS --http1.1 --connect-timeout 5 --max-time 15 \
              -D - -o /dev/null \
              -w $'\nresult code=%{http_code} remote_ip=%{remote_ip} connect=%{time_connect} total=%{time_total}\n' \
              "${url}" || true
            echo
          }

          probe 'https://npm.artifacts.furycloud.io/repository/all/frontend-logger'
          probe 'https://production.furycloud.io/'
          probe 'https://write-us-east-1-npm.artifacts.furycloud.io/repository/all/frontend-logger'
          probe 'https://read-us-east-1-npm.artifacts.furycloud.io/repository/all/frontend-logger'
          probe 'https://npm.nexus-pro.artifacts.furycloud.io/repository/all/frontend-logger'

      - name: Probe Furycore forced routing
        shell: bash
        run: |
          set -u
          probe() {
            local label="$1"
            shift
            echo "===== ${label} ====="
            curl -k -sS --http1.1 --connect-timeout 5 --max-time 15 \
              -D - -o /dev/null \
              -w $'\nresult code=%{http_code} remote_ip=%{remote_ip} connect=%{time_connect} total=%{time_total}\n' \
              "$@" || true
            echo
          }

          probe 'write alias via production connect-to' \
            --connect-to write-us-east-1-npm.artifacts.furycloud.io:443:production.furycloud.io:443 \
            'https://write-us-east-1-npm.artifacts.furycloud.io/repository/all/frontend-logger'

          probe 'read alias via production connect-to' \
            --connect-to read-us-east-1-npm.artifacts.furycloud.io:443:production.furycloud.io:443 \
            'https://read-us-east-1-npm.artifacts.furycloud.io/repository/all/frontend-logger'

          probe 'production host header write alias' \
            -H 'Host: write-us-east-1-npm.artifacts.furycloud.io' \
            'https://production.furycloud.io/repository/all/frontend-logger'

          probe 'production host header npm canonical' \
            -H 'Host: npm.artifacts.furycloud.io' \
            'https://production.furycloud.io/repository/all/frontend-logger'

      - name: Probe internal-only canary through write alias
        shell: bash
        run: |
          set -u
          url='https://write-us-east-1-npm.artifacts.furycloud.io/repository/internal/test-supply-npm-lib-4/-/test-supply-npm-lib-4-1.0.0.tgz'
          echo "===== ${url} ====="
          curl -k -sS --http1.1 --connect-timeout 5 --max-time 15 \
            -D - -o /tmp/canary.tgz \
            -w $'\nresult code=%{http_code} remote_ip=%{remote_ip} size=%{size_download} connect=%{time_connect} total=%{time_total}\n' \
            "${url}" || true
          echo "first-bytes:"
          xxd -g 1 -l 16 /tmp/canary.tgz 2>/dev/null || true

      - name: Verbose timeout detail
        shell: bash
        run: |
          set -u
          curl -k -v --http1.1 --connect-timeout 5 --max-time 15 \
            -o /dev/null \
            'https://write-us-east-1-npm.artifacts.furycloud.io/repository/all/frontend-logger' 2>&1 || true

      - name: Scan world-open singlevpc-main ALBs for artifact Host routing
        shell: bash
        run: |
          set -u
          for alb in \
            frontend-condor-public-bc-f7c742-1573934866.us-east-1.elb.amazonaws.com \
            frontend-condor-public-cc-154163-540847736.us-east-1.elb.amazonaws.com \
            frontend-condor-public-h--95b08d-744192371.us-east-1.elb.amazonaws.com \
            frontend-condor-public-l--e99b46-1546851758.us-east-1.elb.amazonaws.com \
            frontend-condor-public-m--b7d988-312384474.us-east-1.elb.amazonaws.com \
            frontend-condor-public-ml-236aaf-686051025.us-east-1.elb.amazonaws.com \
            frontend-condor-public-ml-bfb25f-1828272909.us-east-1.elb.amazonaws.com \
            frontend-condor-public-ml-cb5197-75299813.us-east-1.elb.amazonaws.com \
            frontend-condor-public-ml-d634da-2140043740.us-east-1.elb.amazonaws.com \
            frontend-condor-public-ml-ea3a50-953118998.us-east-1.elb.amazonaws.com \
            frontend-condor-public-rt-2b1522-910871775.us-east-1.elb.amazonaws.com \
            frontend-condor-public-rt-802ee7-862187859.us-east-1.elb.amazonaws.com \
            frontend-condor-public-rt-832dd7-617097798.us-east-1.elb.amazonaws.com \
            frontend-condor-public-t--3e8589-1566395914.us-east-1.elb.amazonaws.com \
            frontend-row-traffic-laye-80c90e-1347733461.us-east-1.elb.amazonaws.com \
            frontend-rtc-traffic-laye-f6e5c0-1111993847.us-east-1.elb.amazonaws.com \
            frontend-test-traffic-lay-5a3c3f-1914442310.us-east-1.elb.amazonaws.com \
            fury-proxy-internet-1392435328.us-east-1.elb.amazonaws.com \
            k8s-default-furytrou-85f8ee9572-1540854479.us-east-1.elb.amazonaws.com \
            pub-fury-node-go-prod-alb-1154758589.us-east-1.elb.amazonaws.com \
            static-tl-traffic-layer-1da4c5-1177392662.us-east-1.elb.amazonaws.com
          do
            printf '===== %-82s ' "${alb}"
            headers="$(mktemp)"
            curl -k -sS --http1.1 --connect-timeout 3 --max-time 6 \
              -H 'Host: write-us-east-1-npm.artifacts.furycloud.io' \
              -D "${headers}" \
              -o /dev/null \
              -w 'code=%{http_code} remote_ip=%{remote_ip} ' \
              "https://${alb}/repository/all/frontend-logger" || true
            tr -d '\r' < "${headers}" | awk 'BEGIN { server="-"; rps="-" } tolower($1)=="server:" { server=$2 } tolower($1)=="rps:" { rps=$2 } END { printf "server=%s rps=%s\n", server, rps }'
            rm -f "${headers}"
          done

      - name: Scan legacy and alternate public entry points
        shell: bash
        run: |
          set -u
          probe() {
            local label="$1"
            local host="$2"
            local url="$3"
            echo "===== ${label} host=${host} ====="
            curl -k -sS --http1.1 --connect-timeout 5 --max-time 15 \
              -H "Host: ${host}" \
              -D - -o /dev/null \
              -w $'\nresult code=%{http_code} remote_ip=%{remote_ip} connect=%{time_connect} total=%{time_total}\n' \
              "${url}" || true
            echo
          }

          for host in \
            npm.artifacts.furycloud.io \
            write-us-east-1-npm.artifacts.furycloud.io \
            read-us-east-1-npm.artifacts.furycloud.io
          do
            probe 'legacy fury-core external ELB' "${host}" \
              'https://fury-core-external-elb-1248167279.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'
            probe 'legacy fury-trouble ELB' "${host}" \
              'https://fury-trouble-1219831425.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'
            probe 'fury proxy internet ALB' "${host}" \
              'https://fury-proxy-internet-1392435328.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'
            probe 'docker prod ALB' "${host}" \
              'https://fury-artifacts-docker-prod-alb-1194580091.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'
            probe 'docker test ALB' "${host}" \
              'https://fury-artifacts-docker-test-alb-777605583.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'
            probe 'public Nexus test ALB' "${host}" \
              'https://fury-nexus-alb-public-test-test-384832048.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'
          done

          probe 'public Nexus test ALB expected test host' 'test.nexus-pro.artifacts.furycloud.io' \
            'https://fury-nexus-alb-public-test-test-384832048.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'
          probe 'public Nexus test ALB unexpected rust prod host' 'rust.artifacts.furycloud.io' \
            'https://fury-nexus-alb-public-test-test-384832048.us-east-1.elb.amazonaws.com/repository/all/frontend-logger'

      - name: Probe fury-proxy-internet as forward proxy
        shell: bash
        run: |
          set -u
          for target in \
            'http://npm.artifacts.furycloud.io/repository/all/frontend-logger' \
            'https://npm.artifacts.furycloud.io/repository/all/frontend-logger' \
            'http://write-us-east-1-npm.artifacts.furycloud.io/repository/all/frontend-logger' \
            'https://write-us-east-1-npm.artifacts.furycloud.io/repository/all/frontend-logger'
          do
            echo "===== proxy target ${target} ====="
            curl -k --proxy-insecure -sS --http1.1 --connect-timeout 5 --max-time 15 \
              -x 'https://fury-proxy-internet-1392435328.us-east-1.elb.amazonaws.com:443' \
              -D - -o /dev/null \
              -w $'\nresult code=%{http_code} remote_ip=%{remote_ip} connect=%{time_connect} total=%{time_total}\n' \
              "${target}" || true
            echo
          done

      - name: Probe WAF and ALB Host parsing discrepancies
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import socket
          import ssl

          target = "fury-nexus-alb-public-npm-prod-220564011.us-east-1.elb.amazonaws.com"
          cases = {
              "duplicate_host_unblocked_then_canonical": (
                  b"GET /repository/all/frontend-logger HTTP/1.1\r\n"
                  b"Host: example.invalid\r\n"
                  b"Host: npm.artifacts.furycloud.io\r\n"
                  b"Connection: close\r\n\r\n"
              ),
              "duplicate_host_canonical_then_unblocked": (
                  b"GET /repository/all/frontend-logger HTTP/1.1\r\n"
                  b"Host: npm.artifacts.furycloud.io\r\n"
                  b"Host: example.invalid\r\n"
                  b"Connection: close\r\n\r\n"
              ),
              "absolute_form_unblocked_host": (
                  b"GET https://npm.artifacts.furycloud.io/repository/all/frontend-logger HTTP/1.1\r\n"
                  b"Host: example.invalid\r\n"
                  b"Connection: close\r\n\r\n"
              ),
              "absolute_form_alias_host": (
                  b"GET https://npm.artifacts.furycloud.io/repository/all/frontend-logger HTTP/1.1\r\n"
                  b"Host: write-us-east-1-npm.artifacts.furycloud.io\r\n"
                  b"Connection: close\r\n\r\n"
              ),
          }

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          for name, payload in cases.items():
              print(f"===== {name} =====")
              try:
                  with socket.create_connection((target, 443), timeout=5) as raw:
                      with ctx.wrap_socket(raw, server_hostname="npm.artifacts.furycloud.io") as tls:
                          tls.settimeout(10)
                          tls.sendall(payload)
                          chunks = []
                          while True:
                              data = tls.recv(4096)
                              if not data:
                                  break
                              chunks.append(data)
                              if sum(map(len, chunks)) > 16384:
                                  break
                  response = b"".join(chunks).decode("latin1", "replace")
                  head = response.split("\r\n\r\n", 1)[0]
                  print(head)
              except Exception as exc:
                  print(f"error={type(exc).__name__}: {exc}")
              print()
          PY
